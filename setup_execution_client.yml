---
- name: Set up berachain node execution client
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator, fullnode]
    client: execution
  vars_files:
    - group_vars/all.yml
    - group_vars/{{ env }}.yml
    - group_vars/vault.yml

  pre_tasks:
    - name: Setup environment and dependencies
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml
        - name: Include dependencies setup tasks
          ansible.builtin.include_tasks: tasks/setup_dependencies.yml

  tasks:
    - name: Run execution playbook
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include execution role
          ansible.builtin.include_role:
            name: execution
            public: true

  post_tasks:
    - name: Verify execution client
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ execution_log_file_path }}"
            version_command: "{{ execution_bin_dir }}/{{ service_identifier }} --version"
            expected_version: "{{ vars[project][type][client].version | regex_replace('^v', '') }}"
            health_url: "http://localhost:{{ execution_json_rpc_port }}"
            health_method: POST
            health_body: {"jsonrpc": "2.0", "method": "web3_clientVersion", "params": [], "id": 1}
