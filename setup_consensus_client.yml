---
- name: Set up berachain node consensus client
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator, fullnode]
    client: consensus
  vars_files:
    - group_vars/all.yml
    - group_vars/{{ env }}.yml
    - group_vars/vault.yml

  pre_tasks:
    - name: Setup environment and dependencies
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml
        - name: Include dependencies setup tasks
          ansible.builtin.include_tasks: tasks/setup_dependencies.yml

  tasks:
    - name: Run consensus playbook
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include consensus role
          ansible.builtin.include_role:
            name: consensus
            public: true

  post_tasks:
    - name: Verify consensus client
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ consensus_log_file_path }}"
            version_command: "{{ consensus_bin_dir }}/{{ service_identifier }} version --home {{ consensus_home_dir }}"
            expected_version: "{{ vars[project][type][client].version }}"
            health_url: "http://localhost:{{ rpc_port }}/health"
